name: Extract REV379 price provider v2
on:
  push:
    branches: [main]
    paths:
      - 'release-staging/REV381-price-provider-audit-v2/READY'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract matching PC files and snippets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/pc379 && mkdir -p /tmp/pc379/ext
          gh release download v1.16.92 --repo wiliejonathan/tf-multi-analyst-releases --pattern 'TF_Extension_PC_MAC_REV379_DOM_LOGOUT_SIDEBAR_LOGIN_FIX.zip' --output /tmp/pc379/pc.zip
          unzip -q /tmp/pc379/pc.zip -d /tmp/pc379/ext
          mkdir -p audit
          {
            echo '# REV379 PC Price Provider V2'
            echo
            grep -RIl --include='*.js' 'ensure_myfxbook_prices' /tmp/pc379/ext || true
            echo
            for f in $(grep -RIl --include='*.js' 'ensure_myfxbook_prices' /tmp/pc379/ext || true); do
              echo "## FILE $(basename "$f")"
              echo '~~~js'
              python3 - "$f" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text(errors='ignore')
          needles=['ensure_myfxbook_prices','tfMyfxbookPrices','myfxbook','investing']
          seen=[]
          for n in needles:
              start=0
              while True:
                  i=s.lower().find(n.lower(),start)
                  if i<0: break
                  a=max(0,i-7000); b=min(len(s),i+16000)
                  if all(abs(a-x)>5000 for x in seen):
                      print(s[a:b])
                      print('\n/* ---- HIT ---- */\n')
                      seen.append(a)
                  start=i+len(n)
          PY
              echo '~~~'
            done
          } > audit/REV379_PC_PRICE_PROVIDER_V2.md
          wc -c audit/REV379_PC_PRICE_PROVIDER_V2.md
          test $(wc -c < audit/REV379_PC_PRICE_PROVIDER_V2.md) -gt 100
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/REV379_PC_PRICE_PROVIDER_V2.md
          git commit -m 'Extract REV379 PC price provider v2' || exit 0
          git push origin HEAD:main
