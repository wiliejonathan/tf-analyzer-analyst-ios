name: Audit REV379 export bundle remote action
on:
  push:
    branches: [main]
    paths:
      - 'release-staging/REV381-export-action-audit/READY'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract remote export action
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/pc379 && mkdir -p /tmp/pc379/ext
          gh release download v1.16.92 --repo wiliejonathan/tf-multi-analyst-releases --pattern 'TF_Extension_PC_MAC_REV379_DOM_LOGOUT_SIDEBAR_LOGIN_FIX.zip' --output /tmp/pc379/pc.zip
          unzip -q /tmp/pc379/pc.zip -d /tmp/pc379/ext
          mkdir -p audit
          python3 - <<'PY'
          from pathlib import Path
          terms=['export_bundle_prepare','export_bundle_chunk','export_bundle_finish','TF_EXPORT_STORAGE_KEYS','tf_multi_analyst_export_v1']
          out=['# REV379 Remote Export Action Audit','']
          for p in Path('/tmp/pc379/ext').rglob('*.js'):
              s=p.read_text(errors='ignore')
              found=False
              sections=[]
              for term in terms:
                  start=0
                  while True:
                      i=s.find(term,start)
                      if i<0: break
                      found=True
                      sections.append((i,term,s[max(0,i-7000):min(len(s),i+14000)]))
                      start=i+len(term)
              if not found: continue
              out += ['## '+str(p.relative_to(Path('/tmp/pc379/ext')))]
              seen=[]
              for i,term,snip in sorted(sections,key=lambda x:x[0]):
                  if any(abs(i-j)<5000 for j in seen): continue
                  seen.append(i)
                  out += ['',f'### {term} @ {i}','~~~js',snip,'~~~']
          Path('audit/REV379_REMOTE_EXPORT_ACTION.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/REV379_REMOTE_EXPORT_ACTION.md
          git commit -m 'Audit REV379 remote export bundle action' || exit 0
          git push origin HEAD:main
