name: Publish mobile release

on:
  push:
    branches: [main]
    paths:
      - 'release-staging/**/READY'
      - '!release-staging/REV380-mobile/**'
      - '!release-staging/REV380-calc-audit/**'
      - '!release-staging/REV380-data-audit/**'
      - '!release-staging/REV381-mobile/**'
      - '!release-staging/REV381-price-provider-audit/**'
      - '!release-staging/REV382-mobile/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish iOS Browser bundle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          READY=$(find release-staging -name READY -type f -print0 | xargs -0 -r ls -t | head -n 1)
          test -n "$READY"
          DIR=$(dirname "$READY")
          source "$DIR/release.env"
          test -f "$DIR/RELEASE_NOTES.md"
          rm -f "/tmp/$ASSET"
          zip -qr "/tmp/$ASSET" . \
            -x '.git/*' '.github/*' 'release-staging/*'
          unzip -t "/tmp/$ASSET" >/dev/null
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file "$DIR/RELEASE_NOTES.md"
            gh release upload "$TAG" "/tmp/$ASSET" --clobber
          else
            gh release create "$TAG" "/tmp/$ASSET" --target main --title "$TITLE" --notes-file "$DIR/RELEASE_NOTES.md"
          fi
