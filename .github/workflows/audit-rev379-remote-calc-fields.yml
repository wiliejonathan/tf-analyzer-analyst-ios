name: Audit REV379 remote calculated fields
on:
  push:
    branches: [main]
    paths:
      - 'release-staging/REV381-remote-calc-fields/READY'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract remote calculated fields
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/pc379 && mkdir -p /tmp/pc379/ext audit
          gh release download v1.16.92 --repo wiliejonathan/tf-multi-analyst-releases --pattern 'TF_Extension_PC_MAC_REV379_DOM_LOGOUT_SIDEBAR_LOGIN_FIX.zip' --output /tmp/pc379/pc.zip
          unzip -q /tmp/pc379/pc.zip -d /tmp/pc379/ext
          python3 - <<'PY'
          from pathlib import Path
          terms=['dollarPerPip','priceMap','tfMyfxbookPrices','effectiveSl','riskPercent','lot','table1','snapshot','dataFingerprint']
          out=['# REV379 Remote Calculated Fields','']
          for p in Path('/tmp/pc379/ext').rglob('tf-remote-sidebar-agent.js'):
              s=p.read_text(errors='ignore')
              out += ['## '+str(p.relative_to(Path('/tmp/pc379/ext')))]
              seen=[]
              for term in terms:
                  start=0
                  while True:
                      i=s.lower().find(term.lower(),start)
                      if i<0: break
                      if all(abs(i-x)>3000 for x in seen):
                          seen.append(i)
                          out += ['',f'### {term} @ {i}','~~~js',s[max(0,i-2500):min(len(s),i+6500)],'~~~']
                      start=i+len(term)
          Path('audit/REV379_REMOTE_CALCULATED_FIELDS.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
      - name: Commit audit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/REV379_REMOTE_CALCULATED_FIELDS.md
          git commit -m 'Audit REV379 remote calculated fields' || exit 0
          git push origin HEAD:main
