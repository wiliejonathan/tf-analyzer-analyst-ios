name: Audit REV379 price provider
on:
  push:
    branches: [main]
    paths:
      - 'release-staging/REV381-price-provider-audit/READY'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract provider implementation from PC REV379
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/pc379 && mkdir -p /tmp/pc379/ext
          gh release download v1.16.92 --repo wiliejonathan/tf-multi-analyst-releases --pattern 'TF_Extension_PC_MAC_REV379_DOM_LOGOUT_SIDEBAR_LOGIN_FIX.zip' --output /tmp/pc379/pc.zip
          unzip -q /tmp/pc379/pc.zip -d /tmp/pc379/ext
          python3 - <<'PY'
          from pathlib import Path
          import re
          terms=[
            'ensure_myfxbook_prices',
            'tfMyfxbookPrices',
            'myfxbook',
            'investing.com',
            'Investing.com',
            'USDJPY',
            'USDCAD',
            'USDCHF'
          ]
          out=['# REV379 PC price provider implementation','']
          for p in Path('/tmp/pc379/ext').rglob('*.js'):
              s=p.read_text(encoding='utf-8',errors='ignore')
              hits=[]
              for term in terms:
                  starts=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
                  if starts:
                      hits.append((term,starts))
              if not hits:
                  continue
              out += ['## '+str(p.relative_to(Path('/tmp/pc379/ext')))]
              for term,starts in hits:
                  out += ['',f'### {term} ({len(starts)} hits)']
                  for pos in starts[:12]:
                      out += ['~~~js',s[max(0,pos-5000):min(len(s),pos+12000)],'~~~']
          Path('audit').mkdir(exist_ok=True)
          Path('audit/REV379_PC_PRICE_PROVIDER.md').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/REV379_PC_PRICE_PROVIDER.md
          git commit -m 'Audit REV379 PC price provider implementation' || exit 0
          git push origin HEAD:main
