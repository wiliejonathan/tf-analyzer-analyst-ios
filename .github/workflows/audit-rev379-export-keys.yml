name: Extract REV379 EXPORT_DATA_KEYS
on:
  push:
    branches: [main]
    paths:
      - 'release-staging/REV381-export-keys-audit/READY'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact EXPORT_DATA_KEYS assignment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/pc379 && mkdir -p /tmp/pc379/ext
          gh release download v1.16.92 --repo wiliejonathan/tf-multi-analyst-releases --pattern 'TF_Extension_PC_MAC_REV379_DOM_LOGOUT_SIDEBAR_LOGIN_FIX.zip' --output /tmp/pc379/pc.zip
          unzip -q /tmp/pc379/pc.zip -d /tmp/pc379/ext
          mkdir -p audit
          python3 - <<'PY'
          from pathlib import Path
          import re
          out=['# REV379 EXPORT_DATA_KEYS','']
          for p in Path('/tmp/pc379/ext').rglob('*.js'):
              s=p.read_text(errors='ignore')
              if 'EXPORT_DATA_KEYS' not in s: continue
              out += ['## '+str(p.relative_to(Path('/tmp/pc379/ext')))]
              for m in re.finditer(r'\b(?:const|let|var)\s+EXPORT_DATA_KEYS\s*=',s):
                  i=m.start()
                  out += ['','### assignment','~~~js',s[max(0,i-1200):min(len(s),i+6000)],'~~~']
              # Always include first raw occurrence in case assignment is generated differently.
              i=s.find('EXPORT_DATA_KEYS')
              if i>=0:
                  out += ['','### first occurrence','~~~js',s[max(0,i-2500):min(len(s),i+7000)],'~~~']
          Path('audit/REV379_EXPORT_DATA_KEYS.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          test $(wc -c < audit/REV379_EXPORT_DATA_KEYS.md) -gt 100
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/REV379_EXPORT_DATA_KEYS.md
          git commit -m 'Extract REV379 remote export data keys' || exit 0
          git push origin HEAD:main
