name: Extract REV379 price refresh logic
on:
  push:
    branches: [main]
    paths:
      - 'release-staging/REV380-mobile-price-audit/READY'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract PC REV379 price functions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/pc379 && mkdir -p /tmp/pc379/ext
          gh release download v1.16.92 --repo wiliejonathan/tf-multi-analyst-releases --pattern 'TF_Extension_PC_MAC_REV379_DOM_LOGOUT_SIDEBAR_LOGIN_FIX.zip' --output /tmp/pc379/pc.zip
          unzip -q /tmp/pc379/pc.zip -d /tmp/pc379/ext
          python3 - <<'PY'
          from pathlib import Path
          import re
          out=['# REV379 PC price logic audit','']
          for p in Path('/tmp/pc379/ext/assets').glob('*.js'):
              s=p.read_text(errors='ignore')
              if 'tf_refreshMyfxbookPricesForce' not in s and 'TF_MYFXBOOK_PRICES_KEY' not in s:
                  continue
              out += ['## '+p.name]
              names=[]
              for m in re.finditer(r'(?:async\s+)?function\s+([A-Za-z0-9_$]*(?:Myfxbook|Investing|Price)[A-Za-z0-9_$]*)\s*\(',s,re.I):
                  names.append(m.group(1))
              names=sorted(set(names))
              out += ['Functions: '+', '.join(names)]
              def extract(name):
                  m=re.search(r'(?:async\s+)?function\s+'+re.escape(name)+r'\s*\(',s)
                  if not m:return None
                  start=m.start(); brace=s.find('{',m.end()); depth=0; q=None; esc=False; line=False; block=False
                  for i in range(brace,len(s)):
                      c=s[i]; n=s[i+1] if i+1<len(s) else ''
                      if line:
                          if c=='\n': line=False
                          continue
                      if block:
                          if c=='*' and n=='/': block=False
                          continue
                      if q:
                          if esc: esc=False
                          elif c=='\\': esc=True
                          elif c==q: q=None
                          continue
                      if c=='/' and n=='/': line=True; continue
                      if c=='/' and n=='*': block=True; continue
                      if c in ("'",'"',chr(96)): q=c; continue
                      if c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0: return s[start:i+1]
                  return None
              for name in names:
                  body=extract(name)
                  if body and len(body)<25000:
                      out += ['', '### '+name, '~~~js', body, '~~~']
              for term in ['TF_MYFXBOOK_PRICES_KEY','tf_refreshMyfxbookPricesForce','fetch(','Investing.com','myfxbook']:
                  pos=s.find(term)
                  if pos>=0:
                      out += ['', '### context '+term, '~~~js', s[max(0,pos-5000):min(len(s),pos+12000)], '~~~']
          Path('audit').mkdir(exist_ok=True)
          Path('audit/REV379_PC_PRICE_LOGIC.md').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/REV379_PC_PRICE_LOGIC.md
          git commit -m 'Audit REV379 PC price refresh logic' || exit 0
          git push origin HEAD:main
