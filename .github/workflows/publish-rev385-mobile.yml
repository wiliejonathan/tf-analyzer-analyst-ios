name: Publish iOS Browser REV385 holding accuracy
on:
  push:
    branches: [main]
    paths:
      - 'release-staging/REV385-mobile/READY'
permissions:
  contents: write
concurrency:
  group: publish-mobile-rev385
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate REV385 source
        run: |
          set -euo pipefail
          node --check assets/dashboard-mobile.js
          node --check mobile-data-bridge.js
          node --check mobile-remote.js
          node --check mobile-license-gate.js
          node --check mobile-force-update.js
          node --check service-worker.js
          python3 - <<'PY'
          from pathlib import Path
          dash=Path('assets/dashboard-mobile.js').read_text()
          idx=Path('index.html').read_text()
          sw=Path('service-worker.js').read_text()
          gate=Path('mobile-license-gate.js').read_text()
          upd=Path('mobile-force-update.js').read_text()
          assert 'REV385: source of truth is the exact Created At / Closed At displayed in Table 3.' in dash
          assert 'tf_parseHistoryTableDateMs(row.createdDate)' in dash
          assert 'tf_parseHistoryTableDateMs(row.displayDate)' in dash
          assert 'tf_renderHoldingPeriodTables(allTickerRows, filteredRows)' in dash
          assert 'const tf_holdingAllTickerRows = baseRows.slice();' in dash
          assert 'tf_renderHoldingPeriodTables(tf_holdingAllTickerRows, rowsForUi);' in dash
          assert '?rev=385' in idx and '?rev=384' not in idx
          assert '?rev=385' in sw and 'rev385-' in sw
          assert '?rev=385' in gate and '?rev=384' not in gate
          assert "var CURRENT_TAG = 'v1.16.98';" in upd
          print('REV385 mobile source QA PASS')
          PY
      - name: Build iOS/browser bundle
        run: |
          set -euo pipefail
          source release-staging/REV385-mobile/release.env
          rm -f "/tmp/$ASSET" "/tmp/$ASSET.sha256"
          zip -qr "/tmp/$ASSET" . -x '.git/*' '.github/*' 'release-staging/*' 'audit/*'
          unzip -tq "/tmp/$ASSET"
          SHA=$(sha256sum "/tmp/$ASSET" | awk '{print $1}')
          printf '%s  %s\n' "$SHA" "$ASSET" > "/tmp/$ASSET.sha256"
          echo "MOBILE_SHA256=$SHA" >> "$GITHUB_ENV"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source release-staging/REV385-mobile/release.env
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file release-staging/REV385-mobile/RELEASE_NOTES.md --latest
            gh release delete-asset "$TAG" TF_Analyzer_Analyst_iOS_BROWSER_REV385_HOLDING_TABLE3_SOURCE_FIX.zip --yes 2>/dev/null || true
            gh release delete-asset "$TAG" TF_Analyzer_Analyst_iOS_BROWSER_REV385_HOLDING_TABLE3_SOURCE_FIX.zip.sha256 --yes 2>/dev/null || true
            gh release upload "$TAG" "/tmp/$ASSET" "/tmp/$ASSET.sha256" --clobber
          else
            gh release create "$TAG" "/tmp/$ASSET" "/tmp/$ASSET.sha256" --target "$GITHUB_SHA" --title "$TITLE" --notes-file release-staging/REV385-mobile/RELEASE_NOTES.md --latest
          fi
          echo "Published $TAG SHA256=$MOBILE_SHA256"
