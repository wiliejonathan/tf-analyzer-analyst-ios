name: Publish iOS Browser REV478 dashboard performance
on:
  push:
    branches: [main]
    paths:
      - 'release-staging/REV478-mobile/READY'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: QA
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p ../../outputs
          node --check mobile-data-bridge.js
          node --check mobile-chrome-shim.js
          node --check assets/dashboard-mobile.js
          node --check mobile-license-gate.js
          node --check mobile-force-update.js
          node --check service-worker.js
          node --test tests/activation404.cjs
          node --test tests/risk433.cjs
          node --test tests/import407.cjs
          node --test tests/performance406.cjs
          node --test tests/equity412.cjs
          node --test tests/animation414.cjs
          TF_RISK_SOURCE=assets/dashboard-mobile.js node tests/test-risk478.cjs
          TF_RISK_SOURCE=assets/dashboard-mobile.js node tests/test-switches478.cjs
          npm install --no-save playwright
          TF_BROWSER_CHANNEL=chrome node tests/performance478.cjs
          TF_BROWSER_CHANNEL=chrome node tests/report478.cjs
          TF_BROWSER_CHANNEL=chrome node tests/mobile419.cjs
          TF_BROWSER_CHANNEL=chrome node tests/chart417.cjs
          TF_BROWSER_CHANNEL=chrome node tests/adjustment418.cjs
          node --test tests/risk433.cjs
          TF_BROWSER_CHANNEL=chrome node tests/cards-export448.cjs
          TF_BROWSER_CHANNEL=chrome node tests/presentation414.cjs
          TF_BROWSER_CHANNEL=chrome node tests/popup407.cjs
          TF_BROWSER_CHANNEL=chrome node tests/import-browser417.cjs
          TF_BROWSER_CHANNEL=chrome TF_RISK_SOURCE=assets/dashboard-mobile.js TF_DASHBOARD_CSS=assets/dashboard-original.css TF_EXTRA_CSS=mobile-overrides.css node tests/browser406.cjs
          grep -q 'rev478-four-month-risk' service-worker.js
          echo 'REV478 mobile QA PASS'
      - name: Build
        run: |
          set -euo pipefail
          OUT=/tmp/TF_Analyzer_Analyst_iOS_BROWSER_REV478.zip
          zip -qr "$OUT" . -x '.git/*' '.github/*' 'release-staging/*' 'node_modules/*' 'package-lock.json' 'package.json'
          unzip -tq "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: TF_Analyzer_Analyst_iOS_BROWSER_REV478
          path: /tmp/TF_Analyzer_Analyst_iOS_BROWSER_REV478.zip

